services:
  db:
    image: postgres:16-alpine
    env_file: .env
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  node-1:
    build: .
    env_file: .env
    environment:
      NODE_ID: "1"
      PEERS: "http://node-2:8080,http://node-3:8080"
    ports:
      - "8081:8080"
    depends_on:
      db:
        condition: service_healthy

  node-2:
    build: .
    env_file: .env
    environment:
      NODE_ID: "2"
      PEERS: "http://node-1:8080,http://node-3:8080"
    ports:
      - "8082:8080"
    depends_on:
      db:
        condition: service_healthy

  node-3:
    build: .
    env_file: .env
    environment:
      NODE_ID: "3"
      PEERS: "http://node-1:8080,http://node-2:8080"
    ports:
      - "8083:8080"
    depends_on:
      db:
        condition: service_healthy

volumes:
  db_data:
